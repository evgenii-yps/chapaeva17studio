<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Чапаева 17 — технические работы</title>
  <style>
    :root {
      --cream: #F0EAE0;
      --ink: #2A2B26;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding: 32px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 3.5vw, 1.35rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0 0 clamp(28px, 7vw, 48px);
      opacity: 0.85;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(1.7rem, 6.5vw, 2.6rem);
      line-height: 1.2;
      margin: 0 0 clamp(12px, 3vw, 18px);
    }

    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.05rem, 3.8vw, 1.3rem);
      font-weight: 400;
      margin: 0 0 clamp(36px, 9vw, 56px);
      opacity: 0.7;
    }

    .contact-label {
      font-size: clamp(0.85rem, 3vw, 0.95rem);
      letter-spacing: 0.03em;
      margin: 0 0 14px;
      opacity: 0.75;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .links a {
      color: var(--ink);
      text-decoration: none;
      font-size: clamp(0.95rem, 3.4vw, 1.1rem);
      border-bottom: 1px solid rgba(42, 43, 38, 0.35);
      padding-bottom: 2px;
    }

    .links a:hover,
    .links a:focus {
      border-bottom-color: var(--ink);
    }

    .address {
      margin-top: clamp(48px, 12vw, 72px);
      font-size: clamp(0.72rem, 2.6vw, 0.8rem);
      line-height: 1.5;
      letter-spacing: 0.02em;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="logo">Чапаева 17</p>
    <h1>На сайте идут технические работы</h1>
    <p class="subtitle">Скоро вернёмся</p>

    <p class="contact-label">Связаться со студией:</p>
    <p class="links">
      <a href="https://t.me/chapaeva17_studio" target="_blank" rel="noopener">Telegram</a>
      <a href="https://vk.com/chapaeva17_studio" target="_blank" rel="noopener">ВКонтакте</a>
    </p>

    <p class="address">Санкт-Петербург, ул. Чапаева, 17 к.2</p>
  </main>
</body>
</html>
